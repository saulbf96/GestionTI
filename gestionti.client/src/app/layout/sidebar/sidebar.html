<div class="brand">
  <!-- Provisional: se reemplaza por el logo oficial de UNO (pendiente en CLAUDE.md). -->
  <span class="logo">UNO</span>
  <span class="product">Gestión de TI</span>
</div>

<nav aria-label="Menú principal">
  @for (section of sections(); track section.title) {
    <p class="section-title">{{ section.title }}</p>
    <ul>
      @for (item of section.items; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            (click)="navigated.emit()"
          >
            <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  }
</nav>

@if (domain()) {
  <div class="directory" title="Sesión validada con Active Directory">
    <span class="dot" aria-hidden="true"></span>
    <div>
      <strong>Active Directory</strong>
      <span class="gti-mono">{{ domain() }}</span>
    </div>
  </div>
}
